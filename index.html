const W=D.widget;
$("#l1").textContent=U.lbWx;$("#l2").textContent=U.lbNt;$("#l3").textContent=U.lbCal;
$("#wx").innerHTML=`<div class="in"><div class="city">${W.city} ➤</div><div class="big2">${W.temp}</div><div class="bt"><svg viewBox="0 0 24 24"><path fill="#fff" d="M7 18a4 4 0 01-.5-8 5.5 5.5 0 0110.6 1.3A3.4 3.4 0 0117 18z"/></svg><b>${W.cond}</b><br><span>${W.hl}</span></div></div>`;
$("#nw").innerHTML=`<div class="in"><div class="hh">${U.note}</div><div class="tt">${D.notes[0][0]}</div>${D.notes[0][1].split("\n").map(l=>`<div class="ln">${l}</div>`).join("")}</div>`;
$("#nw").onclick=()=>open("note");
function cal(){const o={timeZone:D.tz},d=new Date();
 $("#cal").innerHTML=`<div class="in"><div class="wk">${d.toLocaleDateString(D.locale,{...o,weekday:"long"})}</div><div class="dn">${d.toLocaleDateString(D.locale,{...o,day:"numeric"}).replace(/\D/g,"")}</div><div class="ev">${U.calnone}</div></div>`}
cal();setInterval(cal,60000);
let cur=null;function page(title,html,back,foot){cur=null;$("#status").classList.add("dk");A.innerHTML=`<button class="back" id="bk">‹ ${back?back[1]:U.home}</button><div class="hd">${title}</div><div class="body">${html}</div>${foot||""}`;
 $("#bk").onclick=back?()=>open(back[0]):()=>show("home");show("app")}
function bind(sel,fn){A.querySelectorAll(sel).forEach(e=>e.onclick=()=>fn(+e.dataset.i))}
function open(k){
 if(k==="call"&&ST.callsDone)chk("call");
 if(k==="call")page(U.recent,D.calls.map(c=>`<div class="row"><div><div class="${c[3]?"red":""}">${c[0]}</div><small>${c[1]}</small></div><small>${c[2]}</small></div>`).join(""));
 if(k==="msg"){page(U.msgs,D.msgs.map((m,i)=>{if(!m[1].length)return "";const l=m[1][m[1].length-1];return `<div class="row" style="cursor:pointer" data-i="${i}"><div><div>${m[0]}</div><small>${pv(l[0])}</small></div><small>${l[2]} ${m[2]?'<span style="color:#3478f6">●</span>':''}</small></div>`}).join(""));bind("[data-i]",thread)}
 if(k==="search")safari();
 if(k==="note"){page(U.note,D.notes.map((x,i)=>`<div class="row" style="cursor:pointer" data-i="${i}"><div>${x[0]}<br><small>${x[1].split("\n")[0]}</small></div></div>`).join(""));
  bind("[data-i]",i=>page(D.notes[i][0],`<div class="note"><p>${D.notes[i][1]}</p></div>`,["note",U.note]))}
 if(k==="music")plist();
 if(k==="pdf"){page(U.docs,D.script.map((s,i)=>`<div class="row" style="cursor:pointer" data-i="${i}"><div><span class="pdf">PDF</span>${s[0]}<br><small>${U.recentItem}</small></div></div>`).join(""));
  bind("[data-i]",i=>{const s=D.script[i];page(s[0],`<div class="pdfp"><b>${s[1]}</b>${s[3].replace(new RegExp("^"+s[2]+"  “[^”]*”","gm"),m=>`<span class="hl">${m}</span>`)}</div>`,["pdf",U.docs])})}}
const hm=()=>new Date().toLocaleTimeString(D.locale,{timeZone:D.tz,hour:"2-digit",minute:"2-digit",hour12:false});
const tfmt=s=>{const [d,tm]=s.split(" "),[h,m]=tm.split(":").map(Number),mt=d.match(/^(\d+)\/(\d+)$/);return (mt?U.md(mt[1],mt[2]):d)+" "+(h<12?U.am:U.pm)+" "+(h%12||12)+":"+String(m).padStart(2,"0")};
const mins=s=>{const [h,m]=s.split(" ")[1].split(":").map(Number);return h*60+m};
const need=(t,p)=>!p||p[2].split(" ")[0]!==t[2].split(" ")[0]||Math.abs(mins(t[2])-mins(p[2]))>=60;
const pv=x=>x==="[[news]]"?"🔗 "+D.news.title:x;
const bb=t=>t[0]==="[[news]]"?`<div class="b lnk"><div class="lt">${D.news.title}</div><small>${D.news.site}</small></div>`:`<div class="b ${t[1]?"me":""}">${t[0]}</div>`;
const bub=(t,p)=>(need(t,p)?`<div class="ds">${tfmt(t[2])}</div>`:"")+`<div class="bw ${t[1]?"me":""}">${bb(t)}</div>`;
const TI=D.msgs.findIndex(m=>m[0]===D.story.who),SI=D.msgs.findIndex(m=>m[0]===D.story.stalker),MI=D.msgs.findIndex(m=>m[0]===D.story.manager),MOMI=D.msgs.findIndex(m=>m[0]==="어머니");
const ST={si:0,queue:D.story.segs[0].slice(1),gate:null,ready:false,news:false,final:false,fired:false};
D.msgs[TI][1]=[D.story.segs[0][0]];
const viewing=i=>cur===i&&$("#app").classList.contains("on");
function giveSeg(si){const m=D.msgs[TI],seg=D.story.segs[si];ST.si=si;ST.queue=seg.slice(1);m[1].push(seg[0]);m[2]=1;badge();if(viewing(TI))thread(TI)}
function playAuto(si){const seg=D.story.segs[si],m=D.msgs[TI];ST.si=si;ST.queue=[];let k=0;
 const step=()=>{if(k>=seg.length){segDone(si);return}
  const t=seg[k++],go=()=>{
   if(t[1]||t[4]){m[1].push(t);if(viewing(TI)){A.querySelector(".chat").insertAdjacentHTML("beforeend",bub(t,m[1][m[1].length-2]));const b=A.querySelector(".body");b.scrollTop=b.scrollHeight}step()}
   else arrive(TI,[[t[0],t[2]]],()=>setTimeout(step,800))};
  if(t[3])setTimeout(go,t[3]);else go()};
 step()}
const CK={news:0,mom:0,search:0,call:0};
function ring(name,done){const e=$("#incall");e.innerHTML=`<div class="av">📞</div><div><div class="nm">${name}</div><small>${U.incoming}</small></div><div class="bt"><i class="rd">✕</i><i class="gr">✆</i></div>`;e.classList.add("on");
 setTimeout(()=>{e.classList.remove("on");done()},3000)}
function ringAll(){const L=D.story.rings;let k=0;const next=()=>{if(k>=L.length){ST.callsDone=true;return}const r=L[k++];
  ring(r[0],()=>{const ci=D.calls.findIndex(c=>c[0]==="미도 토라오"&&c[2]==="10/23 22:41");D.calls.splice(ci+1,0,[r[0],"부재중",r[1],1]);setTimeout(next,1500)})};next()}
function chk(k){CK[k]=1;if(CK.news&&CK.mom&&!ST.ring){ST.ring=true;setTimeout(ringAll,2500)}
 if(!ST.hosp&&CK.news&&CK.mom&&CK.search&&CK.call){ST.hosp=true;setTimeout(()=>playAuto(4),4000)}}
function newsRead(){D.search.unshift(...D.story.hist);ST.searchReady=true;const b=$("#sfb");if(b)b.style.display="";
 const ci=D.calls.findIndex(c=>c[0]==="미도 토라오"&&c[2]==="10/23 23:02");D.calls.splice(ci+1,0,...D.story.callsNew);chk("news")}
function momRead(){ST.momDone=true;
 setTimeout(()=>{const m=D.msgs[MOMI],t=D.story.momReply;m[1].push(t);if(viewing(MOMI)){A.querySelector(".chat").insertAdjacentHTML("beforeend",bub(t,m[1][m[1].length-2]));const b=A.querySelector(".body");b.scrollTop=b.scrollHeight}},2000);

 chk("mom")}
function unlockGate(){const g=ST.gate;ST.gate=null;ST.ready=false;setTimeout(()=>playAuto(g+1),1600)}
function segDone(si){setTimeout(()=>{
 if(si<3){ST.gate=si;ST.ready=false;arrive(SI,D.story.gates[si],()=>{ST.ready=true;if(viewing(SI))unlockGate()})}
 else if(si===3)arrive(MI,D.story.mgr);
 else ST.final=true},si===3?9000:1400)}
function arrive(i,items,cb){const m=D.msgs[i],n=$("#notif");let tm;n.onclick=()=>{n.classList.remove("on");thread(i)};
 items.forEach((it,k)=>setTimeout(()=>{const a=Array.isArray(it),tx=a?it[0]:it,t=[tx,0,a?it[1]:U.today+" "+hm()];m[1].push(t);
  if(viewing(i)){A.querySelector(".chat").insertAdjacentHTML("beforeend",bub(t,m[1][m[1].length-2]));const b=A.querySelector(".body");b.scrollTop=b.scrollHeight}
  else{m[2]=1;badge();n.innerHTML=`<div class="ic">💬</div><div style="min-width:0"><b>${m[0]}</b><div class="tx">${pv(tx)}</div></div><small>${D.notify.now}</small>`;
   n.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>n.classList.remove("on"),5000)}
  if(k===items.length-1&&cb)cb()},1200+k*2800))}
function thread(i){$("#notif").classList.remove("on");const m=D.msgs[i],had=m[2];m[2]=0;
 page(m[0],`<div class="chat">${m[1].map((t,j)=>bub(t,m[1][j-1])).join("")}</div>`,["msg",U.msgs]);cur=i;
 const bd=A.querySelector(".body");bd.scrollTop=bd.scrollHeight;
 if(i===TI&&ST.queue.length)bd.onclick=()=>{if(!ST.queue.length)return;const t=ST.queue.shift();m[1].push(t);bd.querySelector(".chat").insertAdjacentHTML("beforeend",bub(t,m[1][m[1].length-2]));bd.scrollTop=bd.scrollHeight;if(!ST.queue.length)segDone(ST.si)};
 if(i===MOMI&&ST.momReady&&!ST.momDone)momRead();
 if(i===SI&&ST.gate!==null&&ST.ready)unlockGate();
 if(had&&m[3]){const q=m[3];m[3]=null;q.forEach((t,k)=>setTimeout(()=>{m[1].push([t[0],0,U.today+" "+hm()]);
  if(viewing(i))thread(i);else m[2]=1},2200*(k+1)))}}
function maybeNotify(){if(ST.final&&!ST.fired){ST.fired=true;arrive(TI,D.notify.texts)}}
const N=D.news;
function news(){page("뉴스",`<div style="padding:4px 18px 30px"><div style="font-size:11px;color:var(--sub)">${N.site}</div><div style="font-size:20px;font-weight:700;line-height:1.35;margin:6px 0">${N.title}</div><div style="font-size:13px;color:var(--sub);margin-bottom:6px">${N.sub}</div><div style="font-size:11px;color:var(--sub);padding-bottom:12px;border-bottom:1px solid var(--line)">${N.time}</div>${N.body.map(p=>`<p style="font-size:14px;line-height:1.75;margin:14px 0">${p}</p>`).join("")}</div>`,["msg",U.msgs]);
 if(!ST.news){ST.news=true;newsRead();setTimeout(()=>arrive(MOMI,D.story.mom,()=>{ST.momReady=true;if(viewing(MOMI))momRead()}),2200)}}
A.addEventListener("click",e=>{if(e.target.closest(".lnk"))news()});
function safari(){page(U.fav,`<div class="fav">${U.favs.map(f=>`<div><span>${f[0]}</span>${f[1]}</div>`).join("")}</div>`,null,`<div class="sbar" id="sb">🔍 ${U.sfph}</div>`);
 $("#sb").onclick=()=>{A.innerHTML=`<div class="sh"><div class="sin">🔍 ${U.sfph}</div><button id="cn">${U.cancel}</button></div><div class="body"><div class="sec">${U.recentS}</div>${D.search.map(x=>`<div class="row">🔍&nbsp;${x}<small>↖</small></div>`).join("")}</div>`;$("#cn").onclick=safari;
  if(ST.searchReady&&!ST.searchSeen){ST.searchSeen=true;const b=$("#sfb");if(b)b.style.display="none";chk("search")}}}
let PL=0;const TR=()=>D.playlists[PL].tracks;
const g=i=>`linear-gradient(135deg,hsl(${i*47+10} 65% 62%),hsl(${i*47+50} 55% 38%))`;
const tabsH=()=>`<div class="tabs">${U.tabs.map((t,j)=>`<span class="${j==2?"on2":""}">${t}</span>`).join("")}</div>`;
function plist(){page(U.lib,`<div class="sec" style="padding-bottom:4px">${U.playlists}</div>`+D.playlists.map((p,j)=>`<div class="mrow" data-i="${j}"><div class="art" style="background:${g(j*5+1)};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;font-family:serif">${p.name}</div><div style="min-width:0"><span class="ttl">${p.name}</span><small>${p.tracks.length} ${U.songs}</small></div><span style="margin-left:auto;color:#c7c7cc">›</span></div>`).join(""),null,tabsH());
 bind("[data-i]",j=>{PL=j;lib(-1)})}
function lib(i){const t=TR(),m=t[i],mini=i>=0?`<div class="mini" id="mn"><div class="art" style="background:${g(PL*5+i)}"></div><div class="ttl">${m[0]}</div><span>⏸ ⏭</span></div>`:"";
 page(D.playlists[PL].name,`<div class="pb"><button id="pa">▶ ${U.play}</button><button id="sf">🔀 ${U.shuffle}</button></div>`+t.map((x,j)=>`<div class="mrow" data-i="${j}"><div class="art" style="background:${g(PL*5+j)}"></div><div style="min-width:0"><span class="ttl">${x[0]}</span><small>${x[1]}</small></div></div>`).join(""),["music",U.lib],mini+tabsH());
 bind("[data-i]",player);$("#pa").onclick=()=>player(0);$("#sf").onclick=()=>player(Math.floor(Math.random()*t.length));if(i>=0)$("#mn").onclick=()=>player(i)}
function player(i){$("#status").classList.remove("dk");const t=TR(),m=t[i],n=t.length,k=PL*5+i,h=k*47+10;let on=true;
 A.innerHTML=`<div class="pl" style="background:linear-gradient(180deg,hsl(${h} 45% 38%),hsl(${h} 50% 14%))"><button id="cl" style="text-align:left;font-size:22px">⌄</button><div class="big" style="background:${g(k)}"></div>
 <div style="font-size:17px;font-weight:700;line-height:1.3">${m[0]}</div><div style="opacity:.7;font-size:15px;margin-top:2px">${m[1]}</div><div class="bar"><i></i></div><div class="tm"><span>1:12</span><span>-3:21</span></div>
 <div class="ctl" style="margin-top:22px;font-size:30px"><button id="pv">⏮</button><button id="pp" style="font-size:38px">⏸</button><button id="nx">⏭</button></div></div>`;
 $("#cl").onclick=()=>lib(i);$("#pv").onclick=()=>player((i+n-1)%n);$("#nx").onclick=()=>player((i+1)%n);
 $("#pp").onclick=()=>{on=!on;$("#pp").textContent=on?"⏸":"▶"}}
</script></body></html>
